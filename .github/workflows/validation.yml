name: Validate formal-way insights
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate projections on main before checking
        if: github.event_name == 'push'
        run: npm run generate
      - name: Syntax, types, model/runtime tests and generation-drift check
        run: npm run check
      - name: Commit validated generated projections
        if: github.event_name == 'push'
        shell: bash
        run: |
          git add generated/ operators/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: update verified generated operator projections"
            git push origin HEAD:main
          fi
